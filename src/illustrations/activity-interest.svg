<svg viewBox="0 0 420 150" preserveAspectRatio="xMidYMid meet" fill="none" stroke-linecap="round" stroke-linejoin="round" class="ill-interest">

  <g class="side side-plain">
    <rect x="16" y="20" width="164" height="72" rx="10" fill="var(--ill-surface, #ffffff)" stroke="var(--ill-muted, #9aabba)" stroke-width="1.3"/>
    <circle cx="40" cy="44" r="6" stroke="var(--ill-muted, #9aabba)" stroke-width="1.3"/>
    <text class="" x="98" y="48" font-size="13" font-family="inherit" font-weight="500" letter-spacing="0.06em" text-anchor="middle" fill="var(--ill-muted, #9aabba)" stroke="none">“Take a break”</text>
    <line x1="40" y1="68" x2="156" y2="68" stroke="var(--ill-muted, #9aabba)" stroke-width="2.4" opacity="0.6"/>
    <text class="" x="98" y="108" font-size="13" font-family="inherit" font-weight="500" letter-spacing="0.06em" text-anchor="middle" fill="var(--ill-muted, #9aabba)" stroke="none">A REMINDER</text>
  </g>

  <text class="" x="210" y="60" font-size="12" font-family="inherit" font-weight="500" letter-spacing="0.06em" text-anchor="middle" fill="var(--ill-muted, #9aabba)" stroke="none">vs</text>

  <g class="side side-activity">
    <rect x="240" y="20" width="164" height="72" rx="10" fill="var(--ill-soft, rgba(15,111,140,0.12))" stroke="var(--ill-accent, #0f6f8c)" stroke-width="1.4"/>
    <circle cx="272" cy="56" r="18" stroke="var(--ill-muted, #9aabba)" stroke-width="1.3"/>
    <circle class="ring" cx="272" cy="56" r="18" stroke="var(--ill-accent, #0f6f8c)" stroke-width="2.2"
            stroke-dasharray="113" stroke-dashoffset="113" transform="rotate(-90 272 56)"/>
    <circle class="core" cx="272" cy="56" r="7" fill="var(--ill-accent, #0f6f8c)" stroke="none" opacity="0.35"/>
    <text class="" x="348" y="52" font-size="14" font-family="inherit" font-weight="500" letter-spacing="0.06em" text-anchor="middle" fill="var(--ill-line, #10243e)" stroke="none">60 seconds</text>
    <text class="" x="348" y="70" font-size="13" font-family="inherit" font-weight="500" letter-spacing="0.06em" text-anchor="middle" fill="var(--ill-muted, #9aabba)" stroke="none">of doing something</text>
    <text class="" x="322" y="108" font-size="13" font-family="inherit" font-weight="500" letter-spacing="0.06em" text-anchor="middle" fill="var(--ill-muted, #9aabba)" stroke="none">AN ACTIVITY</text>
  </g>

  <g class="scale">
    <line x1="120" y1="132" x2="300" y2="132" stroke="var(--ill-muted, #9aabba)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line class="scale-fill" x1="120" y1="132" x2="300" y2="132" stroke="var(--ill-accent, #0f6f8c)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="180" stroke-dashoffset="180"/>
  </g>

</svg>
