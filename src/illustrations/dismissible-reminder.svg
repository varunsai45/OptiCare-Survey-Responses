    <rect x="28" y="30" width="144" height="60" rx="8" fill="var(--ill-surface, #ffffff)" stroke="var(--ill-line, #10243e)" stroke-width="1.4"/>
    <circle cx="46" cy="48" r="5" stroke="var(--ill-accent, #0f6f8c)" stroke-width="1.4"/>
    <circle cx="46" cy="48" r="1.6" fill="var(--ill-accent, #0f6f8c)" stroke="none"/>
    <line x1="58" y1="48" x2="146" y2="48" stroke="var(--ill-muted, #9aabba)" stroke-width="2.6"/>
    <rect x="58" y="62" width="44" height="16" rx="8" stroke="var(--ill-muted, #9aabba)" stroke-width="1.3"/>
